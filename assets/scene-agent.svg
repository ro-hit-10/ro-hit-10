<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="AI customer-support agent">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#170d2e"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#e2e8f0;font-size:13px}
.d{fill:#94a3b8;font-size:11px}
.h{font-size:11px;font-weight:700;letter-spacing:2px}
.b{font-weight:700}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,4%{opacity:0;transform:translate(0px,8px)}7%,100%{opacity:1;transform:translate(0,0)}}.a1{animation:k1 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k2{0%,14%{opacity:0}16%,36%{opacity:1}38%,100%{opacity:0}}.a2{animation:k2 13s infinite both;}@keyframes k3{0%,46%{opacity:0;transform:translate(0px,8px)}49%,100%{opacity:1;transform:translate(0,0)}}.a3{animation:k3 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k4{0%,12%{opacity:0}14.0%,100%{opacity:1}}.a4{animation:k4 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k5{0%,18%{opacity:0}20.0%,100%{opacity:1}}.a5{animation:k5 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k6{0%,22%{opacity:0}24.0%,100%{opacity:1}}.a6{animation:k6 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k7{0%,26%{opacity:0}28.0%,100%{opacity:1}}.a7{animation:k7 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k8{0%,30%{opacity:0;transform:translate(0px,6px)}33%,100%{opacity:1;transform:translate(0,0)}}.a8{animation:k8 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k9{0%,38%{opacity:0;transform:translate(0px,6px)}41%,100%{opacity:1;transform:translate(0,0)}}.a9{animation:k9 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k10{0%,54%{stroke-dashoffset:276.5}72%,100%{stroke-dashoffset:66.4}}.a10{animation:k10 13s infinite both;animation-timing-function:ease-out;}@keyframes k11{0%,70%{opacity:0}73%,100%{opacity:1}}.a11{animation:k11 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k12{0%,70%{opacity:0}73%,100%{opacity:1}}.a12{animation:k12 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k13{0%{opacity:0}3%{opacity:1}93%{opacity:1}98%,100%{opacity:0}}.a13{animation:k13 13s infinite both;}</style>
