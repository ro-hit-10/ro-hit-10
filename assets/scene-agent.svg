 height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="675" y="172" style="fill:#94a3b8;" text-anchor="middle" >Orders</text><path d="M516 213C560 213 560 213 600 213" fill="none" stroke="#334155" stroke-width="1.5"/><path class="flow a6" stroke="#34d399" style="stroke-width:3" d="M516 213C560 213 560 213 600 213"/><rect x="600" y="196" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" /><g class="a7"><rect x="600" y="196" width="150" height="34" rx="8" fill="#052e1f" stroke="#34d399" stroke-width="2" /><text x="675" y="218" class="b" style="fill:#34d399;" text-anchor="middle" >Refunds</text></g><path d="M516 213C560 213 560 259 600 259" fill="none" stroke="#334155" stroke-width="1.5"/><rect x="600" y="242" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="675" y="264" style="fill:#94a3b8;" text-anchor="middle" >Returns</text><path d="M516 213C560 213 560 305 600 305" fill="none" stroke="#334155" stroke-width="1.5"/><rect x="600" y="288" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" /><text x="675" y="310" style="fill:#94a3b8;" text-anchor="middle" >Ticketing</text><g class="a8"><rect x="770" y="232" width="194" height="26" rx="6" fill="#0b1020" stroke="#34d399" stroke-width="1" /><text x="780" y="249" style="fill:#34d399;font-size:11px;" >get_refund_status(8841)</text></g><g class="a9"><rect x="770" y="264" width="194" height="26" rx="6" fill="#0b1020" stroke="#6ee7ff" stroke-width="1" /><text x="780" y="281" style="fill:#6ee7ff;font-size:11px;" >→ status: issued ✓</text></g><circle cx="867" cy="140" r="44" fill="none" stroke="#1e293b" stroke-width="10"/><circle cx="867" cy="140" r="44" fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" class="a10" transform="rotate(-90 867 140)"/><text x="867" y="147" text-anchor="middle" class="b a11" style="font-size:22px;fill:#f8fafc">76%</text><text x="867" y="206" text-anchor="middle" class="d a12">resolved with no human</text>
