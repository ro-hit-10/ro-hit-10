<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112" role="img" aria-label="Say hello">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1340"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect x="3" y="3" width="334" height="106" rx="22"/></clipPath>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
@keyframes sweep{0%,25%{transform:translateX(-140px) skewX(-20deg)}70%,100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.sw{animation:sweep 3.6s ease-in-out infinite;animation-delay:0s}
.gl{animation:glow 2.8s ease-in-out infinite;animation-delay:0s}
.ar{animation:nudge 1.6s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite;animation-delay:0s}
</style>
<rect x="3" y="3" width="334" height="106" rx="22" fill="none" stroke="#f87171" stroke-width="3" filter="url(#gl)" class="gl"/>
<rect x="3" y="3" width="334" height="106" rx="22" fill="url(#bg)" stroke="#f87171" stroke-opacity=".7" stroke-width="1.5"/>
<g clip-path="url(#cp)"><rect class="sw" x="0" y="0" width="90" height="112" fill="url(#sh)"/></g>
<g transform="translate(52 56)"><circle r="24" fill="none" stroke="#f87171" stroke-width="2" class="rg"/><circle r="24" fill="#f87171"/><rect x="-11" y="-8" width="22" height="16" rx="3" fill="none" stroke="#0b1020" stroke-width="2.2"/><path d="M-10 -6l10 8 10-8" fill="none" stroke="#0b1020" stroke-width="2.2" stroke-linejoin="round"/></g>
<text x="96" y="52" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:21px;font-weight:800;fill:#ffffff;" >Say hello</text>
<text x="96" y="74" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:500;fill:#f87171;" >Drop me an email</text>
<g class="ar"><path d="M298 48l12 8-12 8" fill="none" stroke="#f87171" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>