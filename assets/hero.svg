<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="hero.svg">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1b2540" flood-opacity=".14"/></filter>
<filter id="shd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="pg"><rect width="1000" height="340" rx="18"/></clipPath></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flow{fill:none;stroke-dasharray:5 6;animation:dash 1s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,2%{clip-path:inset(0 100% 0 0);opacity:1}16%,100%{clip-path:inset(0 0 0 0);opacity:1}}.a1{animation:k1 10s infinite both;animation-timing-function:steps(11,end);}@keyframes k2{0%,30%{opacity:0;transform:translate(0px,10px)}33%,100%{opacity:1;transform:translate(0,0)}}.a2{animation:k2 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k3{0%,34%{opacity:0;transform:translate(0px,10px)}37%,100%{opacity:1;transform:translate(0,0)}}.a3{animation:k3 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k4{0%,38%{opacity:0;transform:translate(0px,10px)}41%,100%{opacity:1;transform:translate(0,0)}}.a4{animation:k4 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes eyeb{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}.eye{transform-box:fill-box;transform-origin:center;animation:eyeb 5s infinite}@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.nod{animation:nod 4s ease-in-out infinite}@keyframes k5{0%{opacity:0}3%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}.a5{animation:k5 10s infinite both;}</style>
<g clip-path="url(#pg)"><defs><linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#17113d"/></linearGradient><linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs><rect width="1000" height="340" fill="url(#hbg)"/><g filter="url(#blur)"><circle cx="760" cy="90" r="130" fill="#6366f1" opacity=".55" style="animation:bob 7s ease-in-out infinite"/><circle cx="900" cy="280" r="110" fill="#22d3ee" opacity=".35" style="animation:bob 9s ease-in-out infinite"/><circle cx="90" cy="320" r="140" fill="#a855f7" opacity=".3" style="animation:bob 8s ease-in-out infinite"/></g><text x="60" y="96" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;fill:#a5b4fc;letter-spacing:4px;" >AI ENGINEER  ·  DATA SCIENTIST</text><text x="56" y="178" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:92px;font-weight:800;letter-spacing:-3px;fill:url(#nm)" class="a1">Rohit Yeole</text><g class="a2"><rect x="60" y="220" width="98.39999999999999" height="32" rx="16" fill="#ffffff10" stroke="#22d3ee88" stroke-width="1.3" /><circle cx="76" cy="236" r="4" fill="#22d3ee"/><text x="88" y="241" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >PharmEasy</text></g><g class="a3"><rect x="170.39999999999998" y="220" width="106.0" height="32" rx="16" fill="#ffffff10" stroke="#a78bfa88" stroke-width="1.3" /><circle cx="186.39999999999998" cy="236" r="4" fill="#a78bfa"/><text x="198.39999999999998" y="241" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >Data North</text></g><g class="a4"><rect x="288.4" y="220" width="121.19999999999999" height="32" rx="16" fill="#ffffff10" stroke="#34d39988" stroke-width="1.3" /><circle cx="304.4" cy="236" r="4" fill="#34d399"/><text x="316.4" y="241" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >VIT Pune '27</text></g><defs><clipPath id="pc"><circle cx="200" cy="200" r="200"/></clipPath><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1245"/><stop offset="1" stop-color="#3b2a8f"/></linearGradient></defs><circle cx="810" cy="170" r="80" fill="#ffffff10"/><g transform="translate(738 98) scale(0.36)"><g clip-path="url(#pc)"><rect width="400" height="400" fill="url(#pbg)"/><g transform="translate(-64 -78) scale(1.32)">
