<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="hero.svg">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1b2540" flood-opacity=".14"/></filter>
<filter id="shd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="pg"><rect width="1000" height="340" rx="18"/></clipPath></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flow{fill:none;stroke-dasharray:5 6;animation:dash 1s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,2%{clip-path:inset(0 100% 0 0);opacity:1}16%,100%{clip-path:inset(0 0 0 0);opacity:1}}.a1{animation:k1 10s infinite both;animation-timing-function:steps(11,end);}@keyframes k2{0%{opacity:1}30.299999999999997%{opacity:1}32.3%,100%{opacity:0}}.a2{animation:k2 10s infinite both;}@keyframes k3{0%,33.3%{opacity:0}35.3%,63.599999999999994%{opacity:1}65.6%,100%{opacity:0}}.a3{animation:k3 10s infinite both;}@keyframes k4{0%,66.6%{opacity:0}68.6%,96.89999999999999%{opacity:1}98.89999999999999%,100%{opacity:0}}.a4{animation:k4 10s infinite both;}@keyframes k5{0%,30%{opacity:0;transform:translate(0px,10px)}33%,100%{opacity:1;transform:translate(0,0)}}.a5{animation:k5 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k6{0%,34%{opacity:0;transform:translate(0px,10px)}37%,100%{opacity:1;transform:translate(0,0)}}.a6{animation:k6 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k7{0%,38%{opacity:0;transform:translate(0px,10px)}41%,100%{opacity:1;transform:translate(0,0)}}.a7{animation:k7 10s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k8{0%{opacity:0}3%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}.a8{animation:k8 10s infinite both;}</style>
<g clip-path="url(#pg)"><defs><linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#17113d"/></linearGradient><linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs><rect width="1000" height="340" fill="url(#hbg)"/><g filter="url(#blur)"><circle cx="760" cy="90" r="130" fill="#6366f1" opacity=".55" style="animation:bob 7s ease-in-out infinite"/><circle cx="900" cy="280" r="110" fill="#22d3ee" opacity=".35" style="animation:bob 9s ease-in-out infinite"/><circle cx="90" cy="320" r="140" fill="#a855f7" opacity=".3" style="animation:bob 8s ease-in-out infinite"/></g><text x="60" y="96" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;fill:#a5b4fc;letter-spacing:4px;" >AI ENGINEER  ·  DATA SCIENTIST</text><text x="56" y="178" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:92px;font-weight:800;letter-spacing:-3px;fill:url(#nm)" class="a1">Rohit Yeole</text><text x="60" y="232" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:24px;font-weight:400;fill:#e5e7ff;" class="a2" >I make machines read documents.</text><text x="60" y="232" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:24px;font-weight:400;fill:#e5e7ff;" class="a3" >I build agents that talk to customers.</text><text x="60" y="232" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:24px;font-weight:400;fill:#e5e7ff;" class="a4" >I turn messy data into decisions.</text><g class="a5"><rect x="60" y="272" width="98.39999999999999" height="32" rx="16" fill="#ffffff10" stroke="#22d3ee88" stroke-width="1.3" /><circle cx="76" cy="288" r="4" fill="#22d3ee"/><text x="88" y="293" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >PharmEasy</text></g><g class="a6"><rect x="170.39999999999998" y="272" width="106.0" height="32" rx="16" fill="#ffffff10" stroke="#a78bfa88" stroke-width="1.3" /><circle cx="186.39999999999998" cy="288" r="4" fill="#a78bfa"/><text x="198.39999999999998" y="293" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >Data North</text></g><g class="a7"><rect x="288.4" y="272" width="121.19999999999999" height="32" rx="16" fill="#ffffff10" stroke="#34d39988" stroke-width="1.3" /><circle cx="304.4" cy="288" r="4" fill="#34d399"/><text x="316.4" y="293" text-anchor="start" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#fff;" >VIT Pune '27</text></g><circle cx="810" cy="170" r="34" fill="#ffffff12" stroke="#a5b4fc" stroke-width="1.5"/><circle cx="810" cy="170" r="10" fill="#a5b4fc" class="pulse"/><circle cx="810" cy="170" r="66" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="2 7"/><g style="transform-origin:810px 170px;animation:spin 14s linear infinite"><g transform="translate(876 170)"><circle r="15" fill="#0b1020" stroke="#22d3ee" stroke-width="2"/><g style="transform-box:fill-box;transform-origin:center;animation:unspin 14s linear infinite"><text x="0" y="4" text-anchor="middle" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:700;fill:#22d3ee;" >OCR</text></g></g></g><circle cx="810" cy="170" r="100" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="2 7"/><g style="transform-origin:810px 170px;animation:unspin 20s linear infinite"><g transform="translate(910 170)"><circle r="15" fill="#0b1020" stroke="#a78bfa" stroke-width="2"/><g style="transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite"><text x="0" y="4" text-anchor="middle" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:700;fill:#a78bfa;" >LLM</text></g></g></g><circle cx="810" cy="170" r="134" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="2 7"/><g style="transform-origin:810px 170px;animation:spin 28s linear infinite"><g transform="translate(944 170)"><circle r="15" fill="#0b1020" stroke="#34d399" stroke-width="2"/><g style="transform-box:fill-box;transform-origin:center;animation:unspin 28s linear infinite"><text x="0" y="4" text-anchor="middle" style="font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:700;fill:#34d399;" >RAG</text></g></g></g></g>
</svg>