<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="AI-assisted mental-health screening">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#170d2e"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#e2e8f0;font-size:13px}
.d{fill:#94a3b8;font-size:11px}
.h{font-size:11px;font-weight:700;letter-spacing:2px}
.b{font-weight:700}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,4%{transform:scaleX(0)}10%,100%{transform:scaleX(1)}}.a1{animation:k1 13s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k2{0%,7%{transform:scaleX(0)}13%,100%{transform:scaleX(1)}}.a2{animation:k2 13s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k3{0%,10%{transform:scaleX(0)}16%,100%{transform:scaleX(1)}}.a3{animation:k3 13s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k4{0%,13%{transform:scaleX(0)}19%,100%{transform:scaleX(1)}}.a4{animation:k4 13s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k5{0%,16%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}.a5{animation:k5 13s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k6{0%,22%{opacity:0}24.0%,100%{opacity:1}}.a6{animation:k6 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k7{0%,22%{opacity:0}24.0%,100%{opacity:1}}.a7{animation:k7 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k8{0%,30%{opacity:0}32.0%,100%{opacity:1}}.a8{animation:k8 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k9{0%,32%{stroke-dashoffset:220}52%,100%{stroke-dashoffset:60}}.a9{animation:k9 13s infinite both;animation-timing-function:ease-out;}@keyframes k10{0%,32%{opacity:1;transform:rotate(-85deg)}52%,100%{opacity:1;transform:rotate(35deg)}}.a10{animation:k10 13s infinite both;transform-origin:650px 214px;animation-timing-function:cubic-bezier(.3,1.4,.5,1);}@keyframes k11{0%,52%{opacity:0}55%,100%{opacity:1}}.a11{animation:k11 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k12{0%,52%{opacity:0}55%,100%{opacity:1}}.a12{animation:k12 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k13{0%,56%{opacity:0}59%,100%{opacity:1}}.a13{animation:k13 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k14{0%,56%{opacity:0}59%,100%{opacity:1}}.a14{animation:k14 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k15{0%,62%{opacity:0}64.0%,100%{opacity:1}}.a15{animation:k15 13s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k16{0%,64%{clip-path:inset(0 100% 0 0);opacity:1}78%,100%{clip-path:inset(0 0 0 0);opacity:1}}.a16{animation:k16 13s infinite both;animation-timing-function:steps(52,end);}@keyframes k17{0%{opacity:0}3%{opacity:1}93%{opacity:1}98%,100%{opacity:0}}.a17{animation:k17 13s infinite both;}</style>
<rect width="1000" height="360" rx="18" fill="url(#bg)"/>
<rect width="1000" height="360" rx="18" fill="url(#grid)"/>
<g class="a17">
<text x="36" y="38" class="h" style="fill:#f472b6">04 / NLP  ·  INDUSTRY PROJECT</text>
<text x="36" y="66" class="b" style="font-size:22px;fill:#f8fafc">AI-assisted mental-health screening</text>
<text x="964" y="38" class="d" text-anchor="end">RoBERTa · T5 · PHQ-9</text>
<rect x="36" y="96" width="300" height="232" rx="10" fill="#0b1020" stroke="#ffffff" stroke-width="1" stroke-opacity=".14"/><text x="52" y="118" class="d" >PHQ-9 responses</text><text x="52" y="152" style="font-size:11px;" >Little interest</text><rect x="172" y="140" width="144" height="12" rx="6" fill="#1e293b" /><rect x="172" y="140" width="108.0" height="12" rx="6" fill="url(#ink)" class="a1"/><text x="52" y="188" style="font-size:11px;" >Feeling down</text><rect x="172" y="176" width="144" height="12" rx="6" fill="#1e293b" /><rect x="172" y="176" width="72.0" height="12" rx="6" fill="url(#ink)" class="a2"/><text x="52" y="224" style="font-size:11px;" >Sleep trouble</text><rect x="172" y="212" width="144" height="12" rx="6" fill="#1e293b" /><rect x="172" y="212" width="144.0" height="12" rx="6" fill="url(#ink)" class="a3"/><text x="52" y="260" style="font-size:11px;" >Low energy</text><rect x="172" y="248" width="144" height="12" rx="6" fill="#1e293b" /><rect x="172" y="248" width="108.0" height="12" rx="6" fill="url(#ink)" class="a4"/><text x="52" y="296" style="font-size:11px;" >Concentration</text><rect x="172" y="284" width="144" height="12" rx="6" fill="#1e293b" /><rect x="172" y="284" width="36.0" height="12" rx="6" fill="url(#ink)" class="a5"/><g class="a6"><path class="flow" stroke="#6ee7ff" d="M338 212H372"/></g><g class="a7"><rect x="374" y="172" width="130" height="80" rx="12" fill="#0f172a" stroke="url(#ink)" stroke-width="2" /><rect x="368" y="166" width="142" height="92" rx="17" fill="none" stroke="#c084fc" stroke-width="1.5" class="pulse"/><text x="439" y="208" class="b" text-anchor="middle" >RoBERTa</text><text x="439" y="226" class="d" style="font-size:9px;" text-anchor="middle" >domain · depression</text></g><g class="a8"><path class="flow" stroke="#c084fc" d="M506 212H540"/></g><path d="M580 214A70 70 0 0 1 720 214" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/><path d="M580 214A70 70 0 0 1 720 214" fill="none" stroke="url(#ink)" stroke-width="14" stroke-linecap="round" stroke-dasharray="220" class="a9"/><g class="a10"><path d="M650 214L650 156" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/></g><circle cx="650" cy="214" r="7" fill="#f8fafc"/><text x="650" y="246" text-anchor="middle" class="d">screening signal</text><text x="840" y="170" text-anchor="middle" class="b a11" style="font-size:30px;fill:#34d399">95.6%</text><text x="840" y="190" text-anchor="middle" class="d a12">depression-prediction acc.</text><text x="840" y="226" text-anchor="middle" class="b a13" style="font-size:18px;fill:#fbbf24">80%</text><text x="840" y="244" text-anchor="middle" class="d a14">domain classification</text><g class="a15"><rect x="380" y="272" width="584" height="56" rx="10" fill="#0b1020" stroke="#c084fc" stroke-width="1.5" /><text x="396" y="292" class="d" style="font-size:10px;" >T5  ·  generated follow-up question</text></g><text x="396" y="314" class="a16" style="fill:#f1f5f9">You mentioned trouble sleeping - how many nights this week?</text><text x="52" y="316" class="d" style="font-size:9px;" >an aid for therapists, not a diagnosis</text>
</g>
