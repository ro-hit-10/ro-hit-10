<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Pipeline: image to classify to OCR to NER to match to cart">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #e2e8f0; font-size: 14px; text-anchor: middle; }
    .node { fill: #0f172a; stroke: url(#g); stroke-width: 2; }
    .cap  { fill: #94a3b8; font-size: 11px; }
    .flow { stroke: url(#g); stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1s linear infinite; fill: none; }
    .pulse { fill: #6ee7ff; animation: move 5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @keyframes move { from { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } to { transform: translateX(800px); opacity: 0; } }
  </style>
  <rect width="1000" height="170" rx="16" fill="#0b1020"/>
  <path class="flow" d="M100 85 H900"/>
  <circle class="pulse" cx="100" cy="85" r="6"/>

  <g><rect class="node" x="40"  y="55" width="120" height="60" rx="10"/><text x="100" y="82">Image</text><text class="cap" x="100" y="100">raw upload</text></g>
  <g><rect class="node" x="210" y="55" width="120" height="60" rx="10"/><text x="270" y="82">Classify</text><text class="cap" x="270" y="100">zero-shot</text></g>
  <g><rect class="node" x="380" y="55" width="120" height="60" rx="10"/><text x="440" y="82">OCR</text><text class="cap" x="440" y="100">text + boxes</text></g>
  <g><rect class="node" x="550" y="55" width="120" height="60" rx="10"/><text x="610" y="82">NER</text><text class="cap" x="610" y="100">key fields</text></g>
  <g><rect class="node" x="720" y="55" width="120" height="60" rx="10"/><text x="780" y="82">Match</text><text class="cap" x="780" y="100">product catalog</text></g>
  <g><rect class="node" x="880" y="55" width="100" height="60" rx="10"/><text x="930" y="82">Cart</text><text class="cap" x="930" y="100">created</text></g>
</svg>
