ircle><circle r="4.5" fill="#f8fafc" filter="url(#glow)" opacity="0"><animateMotion dur="2.4s" begin="2.2s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" repeatCount="indefinite" begin="2.2s"/></circle><g class="a3"><rect x="700" y="142" width="160" height="56" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="2" /><text x="780" y="166" class="b" style="fill:#c084fc;font-size:12px;" text-anchor="middle" >Offers agent</text><text x="780" y="184" class="d" style="font-size:10px;" text-anchor="middle" >suggest_offers()</text></g><circle r="4.5" fill="#c084fc" filter="url(#glow)" opacity="0"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#q1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" repeatCount="indefinite" begin="1.4s"/></circle><circle r="4.5" fill="#f8fafc" filter="url(#glow)" opacity="0"><animateMotion dur="2.4s" begin="2.6s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" repeatCount="indefinite" begin="2.6s"/></circle><g class="a4"><rect x="140" y="250" width="160" height="56" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="220" y="274" class="b" style="fill:#fbbf24;font-size:12px;" text-anchor="middle" >Settlements</text><text x="220" y="292" class="d" style="font-size:10px;" text-anchor="middle" >get_settlements()</text></g><circle r="4.5" fill="#fbbf24" filter="url(#glow)" opacity="0"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#q2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" repeatCount="indefinite" begin="1.8s"/></circle><circle r="4.5" fill="#f8fafc" filter="url(#glow)" opacity="0"><animateMotion 