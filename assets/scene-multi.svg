<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#e2e8f0;font-size:13px}
.d{fill:#94a3b8;font-size:11px}
.h{font-size:11px;font-weight:700;letter-spacing:2px}
.b{font-weight:700}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,2%{opacity:0;transform:translate(0px,-8px)}5%,100%{opacity:1;transform:translate(0,0)}}.a1{animation:k1 12s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k2{0%,8%{opacity:0;transform:scale(.4)}11%,100%{opacity:1;transform:scale(1)}}.a2{animation:k2 12s infinite both;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.6,.4,1);}@keyframes k3{0%,11%{opacity:0;transform:scale(.4)}14%,100%{opacity:1;transform:scale(1)}}.a3{animation:k3 12s infinite both;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.6,.4,1);}@keyframes k4{0%,14%{opacity:0;transform:scale(.4)}17%,100%{opacity:1;transform:scale(1)}}.a4{animation:k4 12s infinite both;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.6,.4,1);}@keyframes k5{0%,17%{opacity:0;transform:scale(.4)}20%,100%{opacity:1;transform:scale(1)}}.a5{animation:k5 12s infinite both;transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.6,.4,1);}@keyframes k6{0%,56%{opacity:0;transform:translate(0px,8px)}59%,100%{opacity:1;transform:translate(0,0)}}.a6{animation:k6 12s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k7{0%{opacity:0}3%{opacity:1}93%{opacity:1}98%,100%{opacity:0}}.a7{animation:k7 12s infinite both;}</style>
