<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="highlights.svg">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1b2540" flood-opacity=".14"/></filter>
<filter id="shd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="pg"><rect width="1000" height="480" rx="18"/></clipPath></defs>
<style>
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flow{fill:none;stroke-dasharray:5 6;animation:dash 1s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes k1{0%,2%{opacity:0;transform:translate(0px,14px)}5%,100%{opacity:1;transform:translate(0,0)}}.a1{animation:k1 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k2{0%,6%{transform:scaleX(0)}9%,100%{transform:scaleX(1)}}.a2{animation:k2 14s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k3{0%,7%{transform:scaleX(0)}10%,100%{transform:scaleX(1)}}.a3{animation:k3 14s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k4{0%,8%{transform:scaleX(0)}11%,100%{transform:scaleX(1)}}.a4{animation:k4 14s infinite both;transform-box:fill-box;transform-origin:left center;animation-timing-function:ease-out;}@keyframes k5{0%,6%{opacity:0;transform:translate(0px,14px)}9%,100%{opacity:1;transform:translate(0,0)}}.a5{animation:k5 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k6{0%,10%{opacity:0;transform:translate(0px,14px)}13%,100%{opacity:1;transform:translate(0,0)}}.a6{animation:k6 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k7{0%,14%{opacity:0;transform:translate(0px,14px)}17%,100%{opacity:1;transform:translate(0,0)}}.a7{animation:k7 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k8{0%,18%{opacity:0;transform:translate(0px,14px)}21%,100%{opacity:1;transform:translate(0,0)}}.a8{animation:k8 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k9{0%,22%{opacity:0;transform:translate(0px,14px)}25%,100%{opacity:1;transform:translate(0,0)}}.a9{animation:k9 14s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k10{0%{opacity:0}3%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}.a10{animation:k10 14s infinite both;}</style>
