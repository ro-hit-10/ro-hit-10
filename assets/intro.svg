ps(4,end);}@keyframes k12{0%,14%{opacity:0}17%,100%{opacity:1}}.a12{animation:k12 16s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k13{0%,10%{opacity:0;transform:translate(0px,10px)}13%,100%{opacity:1;transform:translate(0,0)}}.a13{animation:k13 16s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}@keyframes k14{0%,12%{transform:translateY(0)}20%,100%{transform:translateY(-146px)}}.a14{animation:k14 16s infinite both;animation-timing-function:steps(2,end);}@keyframes k15{0%,14%{opacity:0}17%,100%{opacity:1}}.a15{animation:k15 16s infinite both;animation-timing-function:cubic-bezier(.2,.8,.2,1);}</style>
